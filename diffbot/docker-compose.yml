version: '3.8'

services:
  neo4j:
    image: neo4j:5.15-community
    container_name: diffbot-neo4j
    ports:
      - "7474:7474"   # HTTP
      - "7687:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc", "gds"]
      - NEO4J_dbms_security_procedures_unrestricted=gds.*,apoc.*
      - NEO4J_dbms_security_procedures_allowlist=gds.*,apoc.*
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - diffbot-network

volumes:
  neo4j_data:
    name: diffbot_neo4j_data
  neo4j_logs:
    name: diffbot_neo4j_logs
  neo4j_import:
    name: diffbot_neo4j_import
  neo4j_plugins:
    name: diffbot_neo4j_plugins

networks:
  diffbot-network:
    name: diffbot_network